const SB_URL='https://vvskhgdqhkxgsvickkme.supabase.co';
const SB_KEY='sb_publishable_Wr_0ATCAgBgv-m5hKAPtwQ_RRV5vb8T';

$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('authEmail').value.trim(),password=$('authPassword').value;msg('');if(mode==='signup'){const {data,error}=await supabase.auth.signUp({email,password});if(error)return msg(error.message);if(data.session){await makeAdmin(data.user);await boot(data.session)}else msg('Account created. Check your email to confirm it, then sign in.',true)}else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)return msg(error.message);await boot(data.session)}};
async function makeAdmin(user){if(!user)return;const {error}=await supabase.from('admin_profiles').insert({id:user.id,email:user.email,display_name:user.email,role:'admin'});if(error && !/duplicate/i.test(error.message)) throw error}
async function isAdmin(){if(!session?.user)return false;const {data}=await supabase.from('admin_profiles').select('id,role').eq('id',session.user.id).eq('role','admin').maybeSingle();return !!data}
async function boot(s){session=s; if(!(await isAdmin())){await supabase.auth.signOut();session=null;msg('This account is not an administrator. Use the first-time setup only for the initial admin account.');return} $('loginView').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}
supabase.auth.getSession().then(async({data})=>{if(data.session)await boot(data.session)});supabase.auth.onAuthStateChange(async(_e,s)=>{if(s && !session) await boot(s)});

async function count(table,filter){let q=supabase.from(table).select('*',{count:'exact',head:true});if(filter)q=filter(q);return (await q).count||0}

async function dashboard(m){const [r,t,d,c]=await Promise.all([count('itinerary_requests',q=>q.eq('status','new')),count('tour_packages',q=>q.eq('active',true)),count('destination_content',q=>q.eq('active',true)),count('site_content')]);m.innerHTML='<div class="page-head"><div><h1>Control Center</h1><p>Your website content and personalised travel enquiries.</p></div></div><div class="cards"><div class="stat"><b>'+r+'</b><span>New personalised requests</span></div><div class="stat"><b>'+t+'</b><span>Active tour packages</span></div><div class="stat"><b>'+d+'</b><span>Active destinations</span></div><div class="stat"><b>'+c+'</b><span>CMS content records</span></div></div><div class="panel" style="margin-top:18px"><h3>What you can edit here</h3><p class="muted">Tour names, prices, descriptions, day-by-day itineraries, inclusions, exclusions, destinations, personalised itinerary templates, enquiries and site/page content. Changes are stored in your Supabase database.</p></div>'}
async function requests(m){const {data,error}=await supabase.from('itinerary_requests').select('*').order('created_at',{ascending:false});m.innerHTML='<div class="page-head"><div><h1>Personalised Requests</h1><p>Review every custom journey submitted through the website.</p></div></div>'+(error?'<div class="notice error">'+esc(error.message)+'</div>':'<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>Journey</th><th>Dates</th><th>Status</th><th>Received</th><th></th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td><b>'+esc(x.client_name)+'</b><br>'+esc(x.email)+'<br>'+esc(x.phone)+'</td><td>'+esc(x.start_location||'')+' → '+esc((x.destinations||[]).map(d=>d.name).join(' → '))+'</td><td>'+esc(x.start_date||'')+'<br>'+esc(x.end_date||'')+'</td><td><select class="req-status" data-id="'+x.id+'">'+['new','reviewing','quoted','confirmed','completed','cancelled'].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td>'+new Date(x.created_at).toLocaleString()+'</td><td><button class="small primary viewReq" data-id="'+x.id+'">View</button></td></tr>').join('')+'</tbody></table></div></div>' );document.querySelectorAll('.req-status').forEach(s=>s.onchange=async()=>{await supabase.from('itinerary_requests').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.id);});document.querySelectorAll('.viewReq').forEach(b=>b.onclick=()=>viewRequest((data||[]).find(x=>x.id===b.dataset.id)))}
function viewRequest(x){if(!x)return;$('modalBody').innerHTML='<h2 style="font-family:Georgia;color:#103b29">'+esc(x.itinerary_title||'Personalised Kenya Journey')+'</h2><p><b>'+esc(x.client_name)+'</b> · '+esc(x.email)+' · '+esc(x.phone)+'</p><p>'+esc(x.start_date||'')+' to '+esc(x.end_date||'')+' · '+esc(x.guests||'')+'</p><div class="itinerary-preview">'+esc(x.itinerary_html||'No itinerary stored.')+'</div>';$('modal').classList.remove('hidden')}

async function tours(m){const {data}=await supabase.from('tour_packages').select('*').order('name');m.innerHTML='<div class="page-head"><div><h1>Tours & Packages</h1><p>Edit the packages displayed on the tours page.</p></div><div class="actions"><button id="importTours" class="gold">Import Existing Website Tours</button><button id="newTour" class="primary">+ New Tour</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Tour</th><th>Days</th><th>Price (USD)</th><th>Active</th><th></th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.destination)+'</span></td><td>'+esc(x.days)+'</td><td>'$'+esc(x.base_price_usd ?? '—')+'</td><td>'+ (x.active?'Yes':'No')+'</td><td><button class="small primary editTour" data-id="'+x.id+'">Edit</button> <button class="small danger delTour" data-id="'+x.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div></div>'; $('newTour').onclick=()=>tourForm();$('importTours').onclick=importTours;document.querySelectorAll('.editTour').forEach(b=>b.onclick=()=>tourForm((data||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll('.delTour').forEach(b=>b.onclick=async()=>{if(confirm('Delete this tour?')){await supabase.from('tour_packages').delete().eq('id',b.dataset.id);show('tours')}})}

n></select></div><div class="field full"><button class="primary">Save Tour</button></div></form>';$('modal').classList.remove('hidden');$('tourForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let j;try{j={itinerary:JSON.parse(f.get('itinerary')||'[]'),included_list:JSON.parse(f.get('included')||'[]'),excluded_list:JSON.parse(f.get('excluded')||'[]'),addons:JSON.parse(f.get('addons')||'[]'),accommodations:JSON.parse(f.get('accommodations')||'[]')}}catch(err){return alert('One of the JSON fields is invalid.')}const row={name:f.get('name'),slug:f.get('slug'),destination:f.get('destination'),days:+f.get('days'),base_price_usd:f.get('price')?+f.get('price'):null,type:f.get('type'),description:f.get('description'),image:f.get('image'),active:f.get('active')==='true',...j,updated_at:new Date().toISOString()};const r=x.id?await supabase.from('tour_packages').update(row).eq('id',x.id):await supabase.from('tour_packages').insert(row);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');show('tours')}}
async function importTours(){const text=await (await fetch('tours.html')).text();const start=text.indexOf('const SAFARI_PACKAGES = ');if(start<0)return alert('Could not find the existing tour package data.');const s=text.indexOf('[',start),end=text.indexOf('\n];',s);try{const arr=Function('return '+text.slice(s,end+2))();for(const x of arr){const slug=x.name.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');await supabase.from('tour_packages').upsert({name:x.name,slug,destination:x.destination,days:x.days,type:x.type,base_price_usd:x.basePriceUSD,group_size:x.groupSize,private_option:x.privateOption,key_inclusions:x.keyInclusions,accommodations:x.accommodations||[],description:x.desc,image:x.image,itinerary:x.itinerary||[],included_list:x.includedList||[],excluded_list:x.excludedList||[],addons:x.addons||[],active:true},{onConflict:'slug'})}alert('Existing website tours imported.');show('tours')}catch(e){alert('Import failed: '+e.message)}}

function tplForm(x={}){$('modalBody').innerHTML='<h2 style="font-family:Georgia;color:#103b29">'+(x.id?'Edit':'New')+' Itinerary Template</h2><form id="tplForm" class="form-grid"><div class="field"><label>Name</label><input name="name" required value="'+esc(x.name)+'"></div><div class="field"><label>Slug</label><input name="slug" required value="'+esc(x.slug)+'"></div><div class="field"><label>Duration days</label><input name="days" type="number" value="'+esc(x.duration_days||'')+'"></div><div class="field"><label>Active</label><select name="active"><option value="true" '+(x.active!==false?'selected':'')+'>Yes</option><option value="false" '+(x.active===false?'selected':'')+'>No</option></select></div><div class="field full"><label>Description</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="field full"><label>Days JSON</label><textarea name="daysjson">'+esc(JSON.stringify(x.days||[],null,2))+'</textarea></div><div class="field full"><button class="primary">Save Template</button></div></form>';$('modal').classList.remove('hidden');$('tplForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let days;try{days=JSON.parse(f.get('daysjson')||'[]')}catch(_){return alert('Days JSON is invalid.')}const row={name:f.get('name'),slug:f.get('slug'),duration_days:f.get('days')?+f.get('days'):null,description:f.get('description'),days,active:f.get('active')==='true',updated_at:new Date().toISOString()};const r=x.id?await supabase.from('itinerary_templates').update(row).eq('id',x.id):await supabase.from('itinerary_templates').insert(row);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');show('templates')}}
async function destinations(m){const {data}=await supabase.from('destination_content').select('*').order('name');m.innerHTML='<div class="page-head"><div><h1>Destinations</h1><p>Edit destination descriptions and media used by your CMS.</p></div><button id="newDest" class="primary">+ New Destination</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Description</th><th>Active</th><th></th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.type)+'</td><td>'+esc(x.description)+'</td><td>'+x.active+'</td><td><button class="small primary editDest" data-id="'+x.id+'">Edit</button> <button class="small danger delDest" data-id="'+x.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div></div>'; $('newDest').onclick=()=>destForm();document.querySelectorAll('.editDest').forEach(b=>b.onclick=()=>destForm((data||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll('.delDest').forEach(b=>b.onclick=async()=>{if(confirm('Delete destination?')){await supabase.from('destination_content').delete().eq('id',b.dataset.id);show('destinations')}})}
function destForm(x={}){$('modalBody').innerHTML='<h2 style="font-family:Georgia;color:#103b29">'+(x.id?'Edit':'New')+' Destination</h2><form id="destForm" class="form-grid"><div class="field"><label>Name</label><input name="name" required value="'+esc(x.name)+'"></div><div class="field"><label>Type</label><input name="type" value="'+esc(x.type)+'"></div><div class="field full"><label>Description</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="field full"><label>Image URL</label><input name="image" value="'+esc(x.image)+'"></div><div class="field"><label>Latitude</label><input name="lat" value="'+esc(x.latitude||'')+'"></div><div class="field"><label>Longitude</label><input name="lon" value="'+esc(x.longitude||'')+'"></div><div class="field"><label>Active</label><select name="active"><option value="true" '+(x.active!==false?'selected':'')+'>Yes</option><option value="false" '+(x.active===false?'selected':'')+'>No</option></select></div><div class="field full"><button class="primary">Save Destination</button></div></form>';$('modal').classList.remove('hidden');$('destForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={name:f.get('name'),type:f.get('type'),description:f.get('description'),image:f.get('image'),latitude:f.get('lat')?+f.get('lat'):null,longitude:f.get('lon')?+f.get('lon'):null,active:f.get('active')==='true',updated_at:new Date().toISOString()};const r=x.id?await supabase.from('destination_content').update(row).eq('id',x.id):await supabase.from('destination_content').insert(row);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');show('destinations')}}
async function content(m){const {data}=await supabase.from('site_content').select('*').order('content_key');m.innerHTML='<div class="page-head"><div><h1>Site Content</h1><p>Manage reusable website settings and content values.</p></div><button id="newContent" class="primary">+ New Content</button></div><div class="panel"><div class="editor-list">'+(data||[]).map(x=>'<div class="editor-row"><div><b>'+esc(x.content_key)+'</b><br><span class="muted">'+esc(x.content_type)+'</span></div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(JSON.stringify(x.content_value))+'</div><div><button class="small primary editContent" data-id="'+x.id+'">Edit</button></div></div>').join('')+'</div></div>'; $('newContent').onclick=()=>contentForm();document.querySelectorAll('.editContent').forEach(b=>b.onclick=()=>contentForm((data||[]).find(x=>x.id===b.dataset.id)))}
function contentForm(x={}){$('modalBody').innerHTML='<h2 style="font-family:Georgia;color:#103b29">'+(x.id?'Edit':'New')+' Site Content</h2><form id="contentForm" class="form-grid"><div class="field"><label>Content Key</label><input name="key" required value="'+esc(x.content_key)+'"></div><div class="field"><label>Type</label><select name="type">'+['text','richtext','json','image','url','number','boolean'].map(t=>'<option '+(x.content_type===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field full"><label>JSON value</label><textarea name="value">'+esc(JSON.stringify(x.content_value||'',null,2))+'</textarea></div><div class="field"><label>Published</label><select name="published"><option value="true" '+(x.published!==false?'selected':'')+'>Yes</option><option value="false" '+(x.published===false?'selected':'')+'>No</option></select></div><div class="field full"><button class="primary">Save Content</button></div></form>';$('modal').classList.remove('hidden');$('contentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let value;try{value=JSON.parse(f.get('value'))}catch(_){return alert('Value must be valid JSON. For plain text use a JSON string such as "Your text".')}const row={content_key:f.get('key'),content_type:f.get('type'),content_value:value,published:f.get('published')==='true',updated_at:new Date().toISOString()};const r=x.id?await supabase.from('site_content').update(row).eq('id',x.id):await supabase.from('site_content').insert(row);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');show('content')}}
async function pages(m){const {data}=await supabase.from('page_content').select('*').order('page_slug');m.innerHTML='<div class="page-head"><div><h1>Page Content</h1><p>Maintain editable page-level content records for future CMS-driven sections.</p></div><button id="newPage" class="primary">+ New Page Record</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Page</th><th>Title</th><th>Meta description</th><th>Published</th><th></th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.page_slug)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.meta_description)+'</td><td>'+x.published+'</td><td><button class="small primary editPage" data-id="'+x.id+'">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'; $('newPage').onclick=()=>pageForm();document.querySelectorAll('.editPage').forEach(b=>b.onclick=()=>pageForm((data||[]).find(x=>x.id===b.dataset.id)))}
function pageForm(x={}){$('modalBody').innerHTML='<h2 style="font-family:Georgia;color:#103b29">'+(x.id?'Edit':'New')+' Page Content</h2><form id="pageForm" class="form-grid"><div class="field"><label>Page slug / filename</label><input name="slug" required value="'+esc(x.page_slug)+'"></div><div class="field"><label>Title</label><input name="title" value="'+esc(x.title)+'"></div><div class="field full"><label>Meta description</label><textarea name="meta">'+esc(x.meta_description)+'</textarea></div><div class="field full"><label>Editable HTML content</label><textarea name="html">'+esc(x.content_html)+'</textarea></div><div class="field"><label>Published</label><select name="published"><option value="true" '+(x.published!==false?'selected':'')+'>Yes</option><option value="false" '+(x.published===false?'selected':'')+'>No</option></select></div><div class="field full"><button class="primary">Save Page Record</button></div></form>';$('modal').classList.remove('hidden');$('pageForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={page_slug:f.get('slug'),title:f.get('title'),meta_description:f.get('meta'),content_html:f.get('html'),published:f.get('published')==='true',updated_at:new Date().toISOString()};const r=x.id?await supabase.from('page_content').update(row).eq('id',x.id):await supabase.from('page_content').insert(row);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');show('pages')}}
</script></body></html>
